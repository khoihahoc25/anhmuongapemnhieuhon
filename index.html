<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ For You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    width:100vw;
    height:100vh;
    background:radial-gradient(circle at center,#1a1a2e,#090912,#000);
    font-family:"Segoe UI",sans-serif;
}

/* Sao */

.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

0%{
opacity:.2;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1.5);
}

}

/* Trái tim */

#heart{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

font-size:140px;

animation:beat 1.2s infinite;

filter:drop-shadow(0 0 25px #ff3366);

z-index:10;

}

@keyframes beat{

0%,100%{

transform:translate(-50%,-50%) scale(1);

}

50%{

transform:translate(-50%,-50%) scale(1.15);

}

}

/* Chữ */

#text{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

color:white;

font-size:42px;

font-weight:bold;

text-shadow:0 0 20px #ff4d88;

white-space:nowrap;

z-index:20;

opacity:0;

animation:showText 6s infinite;

}

@keyframes showText{

0%{

opacity:0;

transform:translate(-50%,-50%) scale(.2);

}

20%{

opacity:1;

transform:translate(-50%,-50%) scale(1);

}

80%{

opacity:1;

transform:translate(-50%,-50%) scale(1.25);

}

100%{

opacity:0;

transform:translate(-50%,-50%) scale(1.6);

}

}

/* Tim bay */

.fly{

position:absolute;

color:#ff4d6d;

animation:fly linear forwards;

}

@keyframes fly{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

</style>

</head>

<body>

<div id="heart">❤️</div>

<div id="text"></div>

<script>

//=====================
// Tạo bầu trời sao
//=====================

for(let i=0;i<250;i++){

let star=document.createElement("div");

star.className="star";

let size=Math.random()*3+1;

star.style.width=size+"px";
star.style.height=size+"px";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";

star.style.animationDuration=(1+Math.random()*3)+"s";

document.body.appendChild(star);

}

//=====================
// Gõ chữ
//=====================

const message="Mình làm người yêu anh nhé? ❤️";

const box=document.getElementById("text");

function typing(){

box.innerHTML="";

let i=0;

let timer=setInterval(()=>{

box.innerHTML+=message.charAt(i);

i++;

if(i>=message.length){

clearInterval(timer);

}

},120);

}

typing();

setInterval(typing,6000);

//=====================
// Tim bay
//=====================

function createHeart(){

let h=document.createElement("div");

h.className="fly";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.top="100vh";

h.style.fontSize=(15+Math.random()*30)+"px";

h.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},9000);

}

setInterval(createHeart,120);

</script>

</body>
</html>
